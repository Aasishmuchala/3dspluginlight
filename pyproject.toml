[project]
name = "lightmatch-max"
version = "0.6.0"
description = "LightMatch inside 3ds Max — match your render's lighting to any reference, natively: grab the VFB, get an exact V-Ray recipe, apply it undoably, re-render, converge."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  # numpy PINNED below 2: V-Ray's native module in 3ds Max crashes on numpy 2.x
  # (a hard runtime requirement, not just advisory).
  "numpy>=1.24,<2",
  "Pillow>=10",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# PySide6 ships inside 3ds Max 2025+ (6.5/6.8); needed only for standalone UI dev.
# Upper-bounded below 6.9: PySide6 6.11 has a flaky Qt-teardown crash in the pytest
# harness (tests pass, the process aborts on exit). Matching Max's bundled version both
# avoids that and mirrors the real runtime.
ui = ["PySide6>=6.5,<6.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ui: offscreen dock tests — need PySide6; run with 'pytest -m ui'"]
# Default run = the deterministic CORE suite (measurement, engine, consensus, census,
# autopilot, scope, session, diagnostics, hardening) — exits cleanly. The offscreen UI
# tests are EXCLUDED by default because PySide6 6.11 crashes pytest on Qt teardown even
# when every test passes (a harness-only Qt/Python GC quirk; the plugin itself is fine —
# real 3ds Max owns the Qt loop). Run the UI tests explicitly with:  pytest -m ui
addopts = "-q -m 'not ui'"
